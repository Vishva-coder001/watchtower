name: Watchtower Scraper

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PORT: 4000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Install scraper-runner dependencies
        working-directory: services/scraper-runner
        run: npm ci

      - name: Start scraper runner
        working-directory: services/scraper-runner
        run: |
          npm run dev > scraper.log 2>&1 &
          echo $! > scraper.pid
          echo "Scraper runner started with PID $(cat scraper.pid)"

      - name: Wait for scraper runner
        shell: bash
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:4000/health; then
              echo
              echo "Scraper runner is healthy."
              exit 0
            fi

            echo "Waiting for scraper runner..."
            sleep 2
          done

          echo
          echo "Scraper runner failed to start."
          echo "========== SCRAPER LOG =========="
          cat services/scraper-runner/scraper.log || true
          echo "================================="
          exit 1

      - name: Verify monitored sites
        run: |
          echo "========== MONITORED SITES =========="
          curl -fsS http://localhost:4000/sites | python -m json.tool
          echo "====================================="

      - name: Run all monitored sites
        shell: bash
        run: |
          echo "Running Watchtower scraper..."

          for attempt in 1 2 3; do
            echo
            echo "========== ATTEMPT $attempt / 3 =========="

            response=$(curl -sS \
              -X POST \
              -w "\nHTTP_STATUS:%{http_code}" \
              http://localhost:4000/run-all)

            echo "$response"

            status=$(echo "$response" | sed -n 's/.*HTTP_STATUS://p')

            if [ "$status" = "200" ]; then
              echo
              echo "Watchtower scrape completed successfully."
              exit 0
            fi

            echo
            echo "run-all returned HTTP $status"

            if [ "$attempt" -lt 3 ]; then
              echo "Retrying in 5 seconds..."
              sleep 5
            fi
          done

          echo
          echo "Watchtower scraper failed after 3 attempts."

          echo
          echo "========== SCRAPER LOG =========="
          cat services/scraper-runner/scraper.log || true
          echo "================================="

          exit 1

      - name: Show scraper logs
        if: always()
        run: |
          echo "========== FINAL SCRAPER LOG =========="
          cat services/scraper-runner/scraper.log || true
          echo "======================================="